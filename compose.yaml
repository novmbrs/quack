# Local development and a single-host deployment of Quack.
#
#   docker compose up -d                       PostgreSQL 18 only (for cargo run/test)
#   docker compose --profile app up -d         + Quack (built from ./Dockerfile)
#   docker compose --profile app --profile telemetry up -d
#                                              + an OTLP collector with Grafana
#
# Quack reads its QUACK_* settings from .env (see .env.example); only the
# database address changes inside the Compose network. With the telemetry
# profile, set QUACK_OTLP_ENDPOINT=http://telemetry:4318 in .env and open
# Grafana at http://localhost:3001 (traces, metrics, and logs).
name: quack

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: quack
      POSTGRES_PASSWORD: quack
      POSTGRES_DB: quack
    ports:
      - "${QUACK_POSTGRES_PORT:-54418}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quack -d quack"]
      interval: 5s
      timeout: 5s
      retries: 20

  quack:
    profiles:
      - app
    build:
      context: .
    image: quack:local
    restart: unless-stopped
    command: ["serve", "--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      QUACK_DATABASE_URL: postgres://quack:quack@postgres:5432/quack
      QUACK_LISTEN_ADDR: 0.0.0.0:8080
      QUACK_OTLP_ENDPOINT: ${QUACK_OTLP_ENDPOINT:-}
    ports:
      - "${QUACK_PORT:-8080}:8080"

  # Grafana's all-in-one OpenTelemetry backend: an OTLP receiver (4318,
  # HTTP/protobuf) feeding Tempo, Loki, and Prometheus, with Grafana on 3001.
  telemetry:
    profiles:
      - telemetry
    image: grafana/otel-lgtm:0.11.10
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "4318:4318"
    volumes:
      - telemetry-data:/data

volumes:
  postgres-data:
  telemetry-data:
