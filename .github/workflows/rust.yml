name: Rust

on:
  push:
    branches: ["main", "rust-rewrite"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # sqlx macros check queries against the committed `.sqlx` data, not a live
  # database, so builds don't depend on the test database's state.
  SQLX_OFFLINE: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quack
          POSTGRES_PASSWORD: quack
          POSTGRES_DB: quack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quack -d quack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://quack:quack@localhost:5432/quack
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      - name: Advisories, licenses, bans, and sources
        run: cargo deny --locked check
