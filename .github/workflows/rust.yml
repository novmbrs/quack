name: Rust

on:
  push:
    branches: ["main", "rust-rewrite"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # sqlx macros check queries against the committed `.sqlx` data, not a live
  # database, so builds don't depend on the test database's state.
  SQLX_OFFLINE: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quack
          POSTGRES_PASSWORD: quack
          POSTGRES_DB: quack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quack -d quack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The importer's end-to-end tests load the Go schema into a scratch
      # MySQL database.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # Every database-backed test makes its own database on this server.
      QUACK_TEST_DATABASE_URL: postgres://quack:quack@localhost:5432/quack
      DATABASE_URL: postgres://quack:quack@localhost:5432/quack
      QUACK_IMPORT_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306
      QUACK_IMPORT_TEST_PG_URL: postgres://quack:quack@localhost:5432/quack
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: The committed OpenAPI document matches the API
        run: cargo test -p quack-api --test openapi --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: The dashboard's API client matches the OpenAPI document
        working-directory: apps/dashboard
        run: |
          bun install --frozen-lockfile
          bun run api
          git diff --exit-code src/api/schema.gen.ts

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t quack:ci .

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      - name: Advisories, licenses, bans, and sources
        run: cargo deny --locked check
