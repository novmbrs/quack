# cargo-deny: advisories, licenses, duplicate/banned crates, and sources.
# Run with `cargo deny check` (cargo-deny 0.21).

[graph]
# Check the graph every member actually builds, including the importer's
# sqlx `mysql` feature.
all-features = false

[advisories]
# RustSec advisories always fail; unmaintained crates fail only when we
# depend on them directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

# Our own crates are unpublished and use the project license (FSL-1.1-MIT).
[licenses.private]
ignore = true

[bans]
# Duplicate versions are worth knowing about but are often transitive and
# out of our hands.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are unpublished, so they need no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
