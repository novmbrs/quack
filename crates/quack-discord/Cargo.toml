[package]
name = "quack-discord"
description = "Quack's Discord adapter, built on Twilight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
quack-core = { workspace = true }
quack-text = { workspace = true }
quack-telemetry = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
twilight-cache-inmemory = { workspace = true }
twilight-gateway = { workspace = true }
twilight-http-ratelimiting = { workspace = true }
twilight-model = { workspace = true }
twilight-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
httpmock = { workspace = true }
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true }
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["test-util", "io-util"] }
